<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 458" preserveAspectRatio="xMidYMid meet">
<defs>
  <radialGradient id="bulb" cx="45%" cy="35%" r="68%"><stop offset="0" stop-color="#fffbe8" stop-opacity=".98"/><stop offset=".45" stop-color="#ffe6a6" stop-opacity=".90"/><stop offset=".78" stop-color="#ffc45f" stop-opacity=".42"/><stop offset="1" stop-color="#ff9b25" stop-opacity=".12"/></radialGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#28b9ef"/><stop offset="1" stop-color="#087bad"/></linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffad42"/><stop offset="1" stop-color="#ef7516"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f5f6"/><stop offset=".45" stop-color="#8a9097"/><stop offset="1" stop-color="#4d535a"/></linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="9" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<!-- warm halo -->
<ellipse cx="180" cy="126" rx="116" ry="112" fill="#f4a43b" opacity=".13" filter="url(#glow)"/>
