name: Rive Tiko Development

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/tiko-rive/**'
      - '.github/workflows/rive-dev.yml'

jobs:
  rive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install graphics libs and Rive CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2 libgl1 libx11-6 libxext6 libxrender1 libxrandr2 libxi6 libxcursor1 libxinerama1
          curl -fsSL https://releases.rive.app/cli/v1.5.1/rive-linux-x64.tar.gz -o /tmp/rive.tar.gz
          echo 'f1c99eadc35920f8a0a802bebe8607101e18c581c040ab0dbf98895cff368477  /tmp/rive.tar.gz' | sha256sum -c -
          tar -xzf /tmp/rive.tar.gz -C /tmp
          chmod +x /tmp/rive
      - name: Extract exact approved Tiko asset
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re
          src=Path('android-app/app/src/main/assets/tiko-original.svg').read_text(encoding='utf-8')
          m=re.search(r'data:image/webp;base64,([^\"\']+)', src)
          if not m: raise SystemExit('Embedded Tiko WebP not found')
          Path('android-app/tiko-rive/tiko.webp').write_bytes(base64.b64decode(m.group(1)))
          print('Extracted exact Tiko:', Path('android-app/tiko-rive/tiko.webp').stat().st_size, 'bytes')
          PY
      - name: Build and inspect Rive
        run: |
          /tmp/rive android-app/tiko-rive --once
          /tmp/rive inspect android-app/tiko-rive --json > /tmp/tiko-inspect.json
          cat /tmp/tiko-inspect.json
          test -f android-app/tiko-rive/build/tiko.riv
          if [ -s android-app/tiko-rive/build/problems.log ]; then cat android-app/tiko-rive/build/problems.log; fi
      - name: Capture idle preview
        run: |
          /tmp/rive android-app/tiko-rive --screenshot=/tmp/tiko-idle.png --advance=90
      - name: Upload Rive preview
        uses: actions/upload-artifact@v4
        with:
          name: tiko-rive-preview
          path: |
            android-app/tiko-rive/build/tiko.riv
            /tmp/tiko-idle.png
            /tmp/tiko-inspect.json
          retention-days: 7
