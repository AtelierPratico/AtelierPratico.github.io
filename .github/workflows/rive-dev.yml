name: Rive Tiko Development

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/rive_probe.py'
      - 'android-app/tiko-rive/**'
      - '.github/workflows/rive-dev.yml'

jobs:
  rive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install graphics libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2 libgl1 libx11-6 libxext6 libxrender1 libxrandr2 libxi6 libxcursor1 libxinerama1
      - name: Probe Rive docs
        run: python android-app/rive_probe.py
