name: Build Pratico AI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: android-app
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk PraticoAI-Android-v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PraticoAI-Android-v1.0
          path: PraticoAI-Android-v1.0.apk
          if-no-files-found: error
          retention-days: 30
