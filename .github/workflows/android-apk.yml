name: Build Pratiko AI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pratiko AI v3.5
        run: python android-app/prepare_v35.py

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: android-app
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk PratikoAI-Android-v3.5.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PratikoAI-Android-v3.5
          path: PratikoAI-Android-v3.5.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view pratiko-ai-v3.5 >/dev/null 2>&1 || \
            gh release create pratiko-ai-v3.5 --title "Pratiko AI Android v3.5" --notes "Pratiko AI v3.5 — réponses texte en streaming, bulle de composition avec trois points animés, affichage progressif de la réponse, création d’images intégrée avec quota Free de 15 créations par mois, mode vocal Tiko et interface entièrement sous la marque Pratiko AI."
          gh release upload pratiko-ai-v3.5 PratikoAI-Android-v3.5.apk --clobber
