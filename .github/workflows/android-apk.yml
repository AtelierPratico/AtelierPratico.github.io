name: Build Pratiko AI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: pratiko-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rive build runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2 libgl1 libx11-6 libxext6 libxrender1 libxrandr2 libxi6 libxcursor1 libxinerama1
          python -m pip install --quiet pillow
          curl -fsSL https://releases.rive.app/cli/v1.5.1/rive-linux-x64.tar.gz -o /tmp/rive.tar.gz
          echo 'f1c99eadc35920f8a0a802bebe8607101e18c581c040ab0dbf98895cff368477  /tmp/rive.tar.gz' | sha256sum -c -
          tar -xzf /tmp/rive.tar.gz -C /tmp
          chmod +x /tmp/rive

      - name: Prepare Pratiko AI v7.5
        env:
          RIVE_CLI: /tmp/rive
        run: python android-app/prepare_v75.py

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: android-app
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk PratikoAI-Android-v7.5.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PratikoAI-Android-v7.5
          path: PratikoAI-Android-v7.5.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pratiko-ai-v7.5
          name: Pratiko AI Android v7.5
          body: "Pratiko AI v7.5 — les réponses de Tiko sont maintenant présentées comme un vrai fil de discussion continu avec bulles premium, meilleur espacement et avatar mieux intégré. Les marqueurs Markdown visibles comme **, ## et les tirets techniques sont nettoyés automatiquement pendant la réponse afin qu’ils ne s’affichent plus comme du texte brut. La voix native fiable, Tiko Rive animé, les images et le moteur IA de v7.4 sont conservés."
          files: PratikoAI-Android-v7.5.apk
