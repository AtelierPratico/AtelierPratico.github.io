name: Build Pratiko AI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: pratiko-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pratiko AI v4.0
        run: python android-app/prepare_v40.py

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: android-app
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk PratikoAI-Android-v4.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PratikoAI-Android-v4.0
          path: PratikoAI-Android-v4.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view pratiko-ai-v4.0 >/dev/null 2>&1 || \
            gh release create pratiko-ai-v4.0 --title "Pratiko AI Android v4.0" --notes "Pratiko AI v4.0 — interface premium modernisée, Entrée pour créer une nouvelle ligne, réponses en streaming, Tiko original plus vivant avec costumes contextuels automatiques (artiste, plombier, chef, techno, prof, bricoleur et coach), génération d’images, quota Free de 15 créations/mois et mode vocal."
          gh release upload pratiko-ai-v4.0 PratikoAI-Android-v4.0.apk --clobber
