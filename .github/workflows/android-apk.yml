name: Build Pratiko AI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: pratiko-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pratiko AI v5.0
        run: python android-app/prepare_v50.py

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: android-app
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk PratikoAI-Android-v5.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PratikoAI-Android-v5.0
          path: PratikoAI-Android-v5.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view pratiko-ai-v5.0 >/dev/null 2>&1 || \
            gh release create pratiko-ai-v5.0 --title "Pratiko AI Android v5.0" --notes "Pratiko AI v5.0 — retour du Tiko original 3D avec casquette jaune P, sans cadre ni panneau autour du personnage. Build Android généré proprement avec Gradle et signature APK Android valide."
          gh release upload pratiko-ai-v5.0 PratikoAI-Android-v5.0.apk --clobber
