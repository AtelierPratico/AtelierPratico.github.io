name: Build Pratico AI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: android-app
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk PraticoAI-Android-v2.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PraticoAI-Android-v2.1
          path: PraticoAI-Android-v2.1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view pratico-ai-v2.1 >/dev/null 2>&1 || \
            gh release create pratico-ai-v2.1 --title "Pratico AI Android v2.1" --notes "Pratico AI Android v2.1 — interface de chat dédiée, backend Supabase connecté et streaming prêt."
          gh release upload pratico-ai-v2.1 PraticoAI-Android-v2.1.apk --clobber
